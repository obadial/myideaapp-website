# Met à jour la page « Sur Instagram » chaque jour avec les derniers posts des apps.
# Le jeton Meta est un secret du dépôt (Settings › Secrets › Actions › IG_ACCESS_TOKEN),
# jamais écrit dans le code. Sans changement, rien n'est poussé.
name: Instagram

on:
  schedule:
    - cron: "17 6 * * *"   # chaque jour vers 8 h (Paris)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Récupérer les posts
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/fetch_instagram.py
      - name: Régénérer la page
        run: python scripts/build_instagram.py
      - name: Vérifier les liens
        run: python scripts/check_links.py
      - name: Publier si quelque chose a changé
        run: |
          # Un chemin absent ferait échouer tout le « git add » : on ajoute ceux qui existent.
          for p in data/instagram.json assets/instagram instagram en/instagram es/instagram sitemap.xml; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          if git diff --cached --quiet; then echo "Aucun nouveau post"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Instagram : mise à jour automatique des posts"
          git push
